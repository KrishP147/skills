name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint skills and agents
        run: python3 scripts/lint.py
      - name: Build site
        run: python3 scripts/build_site.py
      - name: Python tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: repo-scrub tests
        run: python3 -m unittest discover -s repo-scrub/scripts -p "test_*.py"
      - name: Hook self-tests
        run: |
          python3 agents/hooks/guard-git.py --self-test
          python3 hooks/spend-guard.py --self-test
          python3 hooks/smartzone.py --self-test
      - name: Node tests
        run: node --test site/test/filter.test.mjs
