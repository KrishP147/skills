<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/{{NAME}} · Krish's skills</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="{{URL}}">
<meta property="og:site_name" content="Krish's skills">
<meta property="og:title" content="/{{NAME}} · Krish's skills">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{URL}}">
<link rel="stylesheet" href="{{BASE}}/style.css">
</head>
<body class="detail" data-base="{{BASE}}">
<header class="topbar">
  <div class="topbar-in term" id="term">
    <a class="home" href="{{BASE}}/" aria-label="All skills">~/skills</a>
    <div class="prompt-wrap">
      <div class="prompt-box" id="prompt-box">
        <span class="caret-sign" aria-hidden="true">&gt;</span>
        <span class="line" aria-hidden="true"><span id="echo"></span><span class="cursor"></span><span class="hint" id="hint">/ to jump</span></span>
        <input id="cmd" class="cmd" type="text" role="combobox" data-autofocus="false"
               aria-label="Slash command. Type / then a skill or agent name to open it."
               aria-autocomplete="list" aria-expanded="false" aria-controls="menu"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               enterkeyhint="go" inputmode="text">
      </div>
      <ul class="menu" id="menu" role="listbox" aria-label="Matching skills and agents" hidden></ul>
    </div>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </div>
</header>
<main class="wrap">
  <article class="out">
    <p class="echo-line"><span class="caret-sign" aria-hidden="true">&gt;</span> /{{NAME}}</p>
    <div class="card">
      <h1 class="detail-name">/{{NAME}} <span class="tag">{{GROUP}}</span></h1>
      <p class="detail-desc">{{DESCRIPTION}}</p>
      <ul class="chips" aria-label="Facts">
{{CHIPS}}
      </ul>
    </div>
{{BODY}}
  </article>
  <nav class="pn" aria-label="Previous and next">
{{PREVNEXT}}
  </nav>
  <section id="comments" class="comments" aria-label="Comments">
    <h2 class="comments-h">Use cases &amp; tips from the community</h2>
    <script src="https://giscus.app/client.js" data-repo="KrishP147/skills" data-repo-id="R_kgDOUnmd3w" data-category="General" data-category-id="DIC_kwDOUnmd384DGan9" data-mapping="specific" data-term="{{NAME}}" data-strict="1" data-reactions-enabled="1" data-emit-metadata="0" data-input-position="top" data-theme="transparent_dark" data-lang="en" data-loading="lazy" crossorigin="anonymous" async></script>
  </section>
  <footer class="foot dim">
    <a href="{{BASE}}/">&larr; all skills</a> · <a href="https://github.com/KrishP147/skills">source on GitHub</a> · MIT
  </footer>
</main>
<script type="application/json" id="skill-data">{{DATA}}</script>
<script src="{{BASE}}/filter.js"></script>
<script src="{{BASE}}/app.js"></script>
</body>
</html>
